services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine

  celery_worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env.docker
    depends_on:
      - redis

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
